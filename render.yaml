# Render blueprint - The World Remembers API
# Express 5 + pg persistence API for worldremembers.dcl.eth
services:
  - type: web
    name: world-remembers-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node dist/backend/src/index.js
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        sync: false